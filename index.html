  --c-pulso:#CBA052;--c-pulso-claro:rgba(203,160,82,.35);--c-black:#F6F5F0;--c-training:#5B8CFF;--c-musc:#3FD6B8;--c-pacote:#F5C451;
  --c-personal:#FF6B9A;--c-pass:#8FD3FF;--c-outros:#5E615F;--c-risco:#FF6B6B;--c-risco-2:#F5C451;
  --sans:Geist,'Helvetica Neue',Arial,sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,monospace;--g:14px}
*{box-sizing:border-box}html{background:var(--fundo)}body{margin:0;background:var(--fundo);color:var(--tinta);font:400 15px/1.45 var(--sans);font-variant-numeric:tabular-nums;min-height:100vh;overflow-x:hidden}
body.sobre::after{content:"Solte os exports do Angular aqui";position:fixed;inset:16px;border:2px dashed var(--c-pulso);background:rgba(11,11,11,.86);display:grid;place-items:center;font-size:32px;color:var(--c-pulso);z-index:9}
.moldura{padding:18px 28px 22px;min-height:100vh;display:flex;flex-direction:column;gap:var(--g)}
header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{background:#2E2E2E;padding:9px 12px;display:flex}.logo img{height:26px;display:block}
.titulos{flex:1;min-width:260px}h1{margin:0;font-weight:400;font-size:clamp(28px,2.4vw,40px);letter-spacing:-.03em;line-height:1}
#corte{margin:6px 0 0;color:var(--sec);font-size:13px}
#hora{display:flex;align-items:center;gap:8px;color:var(--sec);font-size:14px;flex-wrap:wrap}#hora .prox{flex-basis:100%;text-align:right;font-size:12px;color:var(--fraco)}@keyframes brilho{0%{box-shadow:0 0 0 0 var(--c-pulso-claro)}30%{box-shadow:0 0 0 2px var(--c-pulso-claro)}100%{box-shadow:0 0 0 0 transparent}}.novo{animation:brilho 2.4s ease-out 1}#hora.novo .pix{color:var(--c-pulso);transition:color 1.2s}#toque{position:fixed;right:24px;bottom:22px;background:var(--placa2);color:var(--tinta);padding:10px 14px;font-size:13px;border-left:3px solid var(--c-pulso);opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;pointer-events:none;z-index:9}#toque.ver{opacity:1;transform:none}@media (prefers-reduced-motion:reduce){.novo{animation:none;outline:1px solid var(--c-pulso)}#toque{transition:none}}
.zona{display:flex;align-items:center;gap:10px;background:var(--placa2);color:var(--tinta);border:0;padding:10px 16px;cursor:pointer;font:500 14px var(--sans)}
.zona:hover,.zona:focus-visible{background:var(--c-pulso);color:var(--fundo);outline:none}.zona small{color:inherit;opacity:.7;font-weight:400}
.aviso{display:none;background:#2A1414;color:#FFD5D5;padding:10px 14px;font-size:14px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}.ic.gde{width:26px;height:26px;color:var(--c-pulso)}
#palco{flex:1;display:grid;gap:var(--g);grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:min-content;align-content:start}
.bloco,.tile{background:var(--placa);padding:20px 22px;min-width:0;position:relative}
.b-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
h2{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em;flex:1}
h3{margin:6px 0 0;font-size:14px;font-weight:500;color:var(--sec)}
.src{font-size:12px;color:var(--fraco);max-width:46%;text-align:right;line-height:1.3}
.b-vendas{grid-column:span 8;grid-row:span 2}.b-pag{grid-column:span 4}.faixa{grid-column:span 4;display:grid;grid-template-columns:1fr 1fr;gap:var(--g)}
.b-fam{grid-column:span 5}.b-ven{grid-column:span 4}.b-oc{grid-column:span 3}.b-risco{grid-column:span 3}.b-ass{grid-column:span 4}.b-nota{grid-column:span 3}.b-aniv{grid-column:span 2}
.vendas-num{display:grid;grid-template-columns:1fr auto;gap:4px 24px;align-items:end}
.big{font-size:clamp(64px,7vw,128px);font-weight:300;letter-spacing:-.05em;line-height:.9;color:var(--tinta)}
.vs{grid-column:1;color:var(--sec);font-size:15px}
.meta{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:14px}.meta p{margin:0;font-size:14px;color:var(--sec);line-height:1.5}.meta b{color:var(--tinta);font-weight:500}
.anel-meta{width:132px;height:132px}.anel-t{fill:var(--tinta);font-size:19px;font-weight:500}.anel-s{fill:var(--sec);font-size:10px}
.delta{font-weight:600;padding:2px 8px;margin-right:6px;font-size:14px}.delta.sobe{background:rgba(63,214,184,.16);color:var(--c-musc)}.delta.desce{background:rgba(255,107,107,.16);color:var(--c-risco)}
.pulso{width:100%;height:auto;display:block;margin-top:14px}
.pulso-linha{fill:none;stroke:var(--c-pulso);stroke-width:3.5;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(200,242,90,.45))}
.pulso-ant{fill:none;stroke:var(--sec);stroke-width:2;stroke-dasharray:7 6;opacity:.75}
.pulso-dia{fill:var(--c-pulso);opacity:.28}.pulso-dia:hover{opacity:.8}
.pulso-ponto{fill:var(--c-pulso)}.pulso-onda{fill:none;stroke:var(--c-pulso);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:onda 2.2s ease-out infinite}
@keyframes onda{from{transform:scale(1);opacity:.9}to{transform:scale(4.5);opacity:0}}
.eixo{fill:var(--fraco);font-size:15px}.rot{fill:var(--sec);font-size:17px;paint-order:stroke;stroke:var(--placa);stroke-width:6px}.rot-a{fill:var(--c-pulso);font-weight:600}
.leg-l{margin:8px 0 0;color:var(--sec);font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.li{display:inline-block;width:18px;height:4px;margin-right:6px;vertical-align:middle}.li-a{background:var(--c-pulso)}.li-p{background:repeating-linear-gradient(90deg,var(--sec) 0 5px,transparent 5px 9px)}.li-d{background:var(--c-pulso);opacity:.35;height:10px;width:8px}
.pag-flex{display:flex;align-items:center;gap:20px}.anel-pag{width:190px;height:190px;flex:0 0 auto}.anel-big{fill:var(--tinta);font-size:34px;font-weight:300;letter-spacing:-.03em}
.leg-v{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;color:var(--sec)}.leg-v i{display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-1px}.leg-v b{color:var(--tinta);font-weight:500;font-size:17px;margin-right:4px}
.nota{margin:12px 0 0;color:var(--sec);font-size:13px}
.tile{display:flex;flex-direction:column;gap:6px}.tile .ic{color:var(--c-pulso)}.tile p{margin:0;color:var(--sec);font-size:13px}.tile p.mini{font-size:12px}
.mid{font-size:clamp(30px,2.5vw,42px);font-weight:300;letter-spacing:-.03em;line-height:1.05}.mid small{font-size:.45em;color:var(--sec);letter-spacing:0;margin-left:4px}
.alerta{color:var(--c-risco-2);font-weight:500}
.mini-barra,.barra-duo{display:flex;height:8px;gap:2px}.mini-barra span,.barra-duo span{display:block}.barra-duo{height:14px;margin:14px 0}
.regua{position:relative;height:8px;background:linear-gradient(90deg,var(--trilho),var(--c-pacote));margin:6px 0 4px}.regua span{position:absolute;top:-5px;width:4px;height:18px;background:var(--tinta);transform:translateX(-2px)}
.tickets{display:flex;flex-wrap:wrap;gap:4px}.tickets i{width:14px;height:20px;background:var(--c-pass);clip-path:polygon(0 0,100% 0,100% 38%,80% 50%,100% 62%,100% 100%,0 100%,0 62%,20% 50%,0 38%)}
.tree{width:100%;height:auto;display:block}.tree-r{transition:opacity .2s}.tree-r:hover{opacity:.82}
.tree-k{fill:#0B0B0B;font-size:16px;font-weight:600}.tree-v{fill:#0B0B0B;font-size:26px;font-weight:300;letter-spacing:-.02em}.tree-s{fill:#0B0B0B;font-size:12.5px;opacity:.75}
.lolli{display:grid;gap:9px}.lo-l{display:grid;grid-template-columns:118px 1fr 108px;align-items:center;gap:10px;font-size:14px}.lo-n{color:var(--tinta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lo-t{position:relative;height:16px}.lo-b{position:absolute;left:0;top:7px;height:2px;background:var(--c-training)}.lo-p{position:absolute;top:2px;width:12px;height:12px;border-radius:50%;background:var(--c-training);transform:translateX(-6px);box-shadow:0 0 0 4px rgba(91,140,255,.18)}
.lo-v{text-align:right;font-weight:500}.lo-v small{display:block;color:var(--fraco);font-weight:400;font-size:12px}
.oc-top p{margin:4px 0 0;color:var(--sec);font-size:13px}
.aneis{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px;margin-top:14px}.aneis figure{margin:0;text-align:center}.aneis svg{width:78px;height:78px}
.anel-m{fill:var(--tinta);font-size:16px;font-weight:500}.aneis figcaption{font-size:13px}.aneis small{display:block;color:var(--fraco);font-size:11.5px}
.waffle{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin:14px 0}.waffle i{aspect-ratio:1;display:block}.waffle i.rec{outline:2px solid var(--c-musc);outline-offset:-2px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}.duo .k{display:block;color:var(--sec);font-size:13px}.duo b{font-size:clamp(24px,1.9vw,32px);font-weight:300;letter-spacing:-.02em;display:block}.duo small{color:var(--fraco)}
.pm{display:grid;gap:8px}.pm-l{display:grid;grid-template-columns:20px 1fr 90px 96px;align-items:center;gap:8px;font-size:13px;color:var(--sec)}.pm-l b{color:var(--tinta);font-weight:500;text-align:right}
.pm-t{height:6px;background:var(--trilho)}.pm-t span{display:block;height:100%;background:var(--c-pacote)}
.estrelas{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px}.st-on{color:var(--c-pacote);fill:var(--c-pacote);width:24px;height:24px}.st-off{color:var(--c-risco);width:24px;height:24px}
.b-nota p{margin:0 0 10px;color:var(--sec);font-size:13px}.b-nota p b{color:var(--tinta);font-weight:500}
.nuvem{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}.nuvem span{color:var(--c-pass);line-height:1.1}.nuvem small{font-size:11px;color:var(--fraco);margin-left:3px}
.aniv{display:flex;flex-wrap:wrap;gap:6px}.aniv span{background:var(--placa2);padding:5px 9px;font-size:13px}.aniv b{color:var(--c-personal);font-weight:600;margin-right:6px}
.arco{transition:stroke-dasharray 1s ease}
@media (prefers-reduced-motion:reduce){.pulso-onda{animation:none;opacity:0}.arco{transition:none}}
@media (max-width:1400px){.b-vendas{grid-column:span 12}.b-pag,.faixa{grid-column:span 6}.b-fam,.b-ven,.b-ass{grid-column:span 6}.b-oc,.b-risco,.b-nota,.b-aniv{grid-column:span 6}}
@media (max-width:760px){.moldura{padding:14px 16px}#palco>*{grid-column:span 12!important}.faixa{grid-template-columns:1fr}.vendas-num{grid-template-columns:1fr}.meta{grid-column:1;grid-row:auto}.pag-flex{flex-direction:column;align-items:flex-start}.src{display:none}.lo-l{grid-template-columns:90px 1fr 92px}}

@media (min-width:1401px){
.moldura{min-height:100vh;padding:14px 24px 16px;gap:12px}#palco{gap:12px;grid-template-rows:auto auto auto}
.b-vendas{grid-column:1/7;grid-row:1}.b-pag{grid-column:7/10;grid-row:1}.faixa{grid-column:10/13;grid-row:1;gap:12px}
.b-fam{grid-column:1/5;grid-row:2}.b-ven{grid-column:5/8;grid-row:2}.b-oc{grid-column:8/11;grid-row:2}.b-risco{grid-column:11/13;grid-row:2}
.b-ass{grid-column:1/6;grid-row:3}.b-nota{grid-column:6/10;grid-row:3}.b-aniv{grid-column:10/13;grid-row:3}
.bloco,.tile{padding:14px 16px}.b-head{margin-bottom:6px}.big{font-size:clamp(56px,4.6vw,92px)}.anel-meta{width:104px;height:104px}.meta{gap:10px}
.anel-pag{width:150px;height:150px}.pag-flex{gap:14px}.mid{font-size:clamp(24px,1.9vw,34px)}.tile{gap:4px}.tile p{font-size:12px}
.faixa{grid-template-rows:1fr 1fr}.tickets i{width:11px;height:16px}
.lolli{gap:5px}.lo-l{font-size:13px;grid-template-columns:104px 1fr 96px}.aneis{grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.aneis svg{width:62px;height:62px}
.waffle{grid-template-columns:repeat(11,1fr);gap:3px;margin:8px 0}.leg-v{gap:4px;font-size:13px}.leg-v b{font-size:15px}
.tree{max-height:200px}.duo b{font-size:26px}.barra-duo{margin:8px 0}.pm{gap:5px}.nota{margin-top:6px;font-size:12px}
.estrelas .ic{width:20px;height:20px}.nuvem span{line-height:1}.aniv span{padding:4px 7px;font-size:12.5px}
}

@media (min-width:1401px){.lo-v small{display:inline;margin-left:4px}.lo-l{grid-template-columns:110px 1fr 110px}.lo-t{height:12px}.lo-b{top:5px}.lo-p{top:0;width:10px;height:10px;transform:translateX(-5px)}.lolli{gap:3px}
.big{font-size:clamp(52px,4vw,80px)}.vendas-num{gap:2px 18px}.pulso{margin-top:4px}.leg-l{margin-top:2px}
.aneis figcaption{font-size:12px;line-height:1.2}.tree{max-height:170px}.b-risco .mid small{display:block}
.bloco,.tile{padding:12px 16px}h2{font-size:16px}.b-head .ic.gde{width:22px;height:22px}}

.ass-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.ass-grid .duo{grid-template-columns:1fr}.pm-l{grid-template-columns:18px 1fr 60px 84px}
@media (max-width:760px){.ass-grid{grid-template-columns:1fr}}
.ass2{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}.ass2 .duo{grid-template-columns:1fr 1fr}

const SOM=(()=>{ let ac=null, liga=false, pend=false;
  try{ liga=localStorage.getItem("som-dash-club")==="1"; }catch(e){}
  const calmo=()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } };
  const ctx=()=>{ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(ac.state==="suspended") ac.resume(); return ac; };
  // tom: uma senoide com ataque de 4 ms e queda exponencial até 0.001
  const tom=(c,f0,f1,ini,dur,vol,tipo)=>{ const t=c.currentTime+ini, o=c.createOscillator(), g=c.createGain();
    o.type=tipo||"sine"; o.frequency.setValueAtTime(f0,t); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(vol,t+.004); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.01); };
  const S={
    clique:c=>tom(c,1800,1200,0,.035,.04),                       // botão: tique curto
    tema:c=>tom(c,520,780,0,.09,.05,"triangle"),                 // troca de tema: deslize leve para cima
    abre:c=>tom(c,600,900,0,.07,.045),                           // card abre
    fecha:c=>tom(c,900,600,0,.07,.04),                           // card fecha
    novo:c=>{ tom(c,880,880,0,.06,.035); tom(c,1320,1320,.07,.08,.03); }, // números mudaram: duas notas, 150 ms
    liga:c=>{ tom(c,660,660,0,.05,.045); tom(c,990,990,.06,.07,.04); }
  };
  const toca=n=>{ if(!liga||calmo()) return; const c=ctx(); if(!c||c.state!=="running") return; try{ S[n](c); }catch(e){} };
  const gesto=()=>{ if(pend){ pend=false; setTimeout(()=>toca("novo"),60); } };
  addEventListener("pointerdown",gesto); addEventListener("keydown",gesto);
  return { toca, get liga(){return liga}, set(v){ liga=v; try{localStorage.setItem("som-dash-club",v?"1":"0")}catch(e){} if(v){ ctx(); toca("liga"); } },
    pendente(){ pend=true; } };
})();
